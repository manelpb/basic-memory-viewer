name: build

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "Dockerfile"
      - "requirements.txt"
      - ".github/workflows/build.yml"
  workflow_dispatch: {}
  # Called by release-please.yml after it cuts a release, to publish the same
  # content under its version tag as well as its SHA.
  workflow_call:
    inputs:
      extra_tag:
        description: "Additional immutable tag to publish (e.g. v0.2.0)."
        type: string
        required: false
        default: ""

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/manelpb/basic-memory-viewer
          # Immutable tags only — no moving `latest`. Deploys pin a SHA or a
          # version so rollouts are deterministic and rollbackable. Release
          # builds carry both: the SHA and the vX.Y.Z that release-please cut.
          tags: |
            type=sha,prefix=,format=short
            type=raw,value=${{ inputs.extra_tag }},enable=${{ inputs.extra_tag != '' }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          provenance: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
